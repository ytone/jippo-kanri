<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2D3A2E">
<title>実包管理帳</title>
<style>
  :root {
    --bg: #F5F3EE;
    --surface: #FFFFFF;
    --surface2: #EDEAE3;
    --border: #D5D0C5;
    --text: #1A1F1B;
    --text2: #6B7068;
    --olive: #2D3A2E;
    --olive-light: #3D4E3E;
    --brass: #C9A84C;
    --brass-light: #E8CC7A;
    --red: #C0392B;
    --green: #27AE60;
    --warn: #E67E22;
    --font-mono: 'SF Mono', 'Courier New', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, 'Hiragino Sans', 'Yu Gothic UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 80px;
  }

  /* ── ヘッダー ── */
  header {
    background: var(--olive);
    color: #fff;
    padding: 16px 20px 12px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  header h1 {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.05em;
  }
  header .subtitle {
    font-size: 11px;
    color: var(--brass-light);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-top: 2px;
  }

  /* ── ナビ ── */
  nav {
    background: var(--olive);
    display: flex;
    border-top: 1px solid var(--olive-light);
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 100;
  }
  nav button {
    flex: 1;
    background: none;
    border: none;
    color: rgba(255,255,255,0.5);
    padding: 10px 4px 14px;
    font-size: 10px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    transition: color 0.15s;
  }
  nav button .icon { font-size: 20px; }
  nav button.active { color: var(--brass-light); }

  /* ── ページ ── */
  .page { display: none; padding: 16px; }
  .page.active { display: block; }

  /* ── カード ── */
  .card {
    background: var(--surface);
    border-radius: 12px;
    border: 1px solid var(--border);
    margin-bottom: 12px;
    overflow: hidden;
  }
  .card-header {
    background: var(--olive);
    color: #fff;
    padding: 10px 16px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .card-body { padding: 16px; }

  /* ── サマリー ── */
  .summary-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 16px;
  }
  .summary-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    text-align: center;
  }
  .summary-item .val {
    font-family: var(--font-mono);
    font-size: 28px;
    font-weight: 700;
    color: var(--olive);
    line-height: 1;
  }
  .summary-item .lbl {
    font-size: 11px;
    color: var(--text2);
    margin-top: 4px;
    letter-spacing: 0.06em;
  }

  /* ── 弾薬ゲージ ── */
  .bullet-gauge {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 8px;
  }
  .bullet-icon {
    width: 18px;
    height: 18px;
    display: inline-block;
    font-size: 16px;
    line-height: 1;
    opacity: 1;
  }
  .bullet-icon.empty { opacity: 0.15; }

  /* ── 許可証 ── */
  .permit-card {
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 10px;
    border-left: 4px solid var(--green);
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 4px solid var(--green);
  }
  .permit-card.warn { border-left-color: var(--warn); }
  .permit-card.danger { border-left-color: var(--red); }
  .permit-card .permit-name { font-weight: 700; font-size: 15px; margin-bottom: 4px; }
  .permit-card .permit-meta { font-size: 12px; color: var(--text2); }
  .permit-card .permit-days {
    font-family: var(--font-mono);
    font-size: 24px;
    font-weight: 700;
    float: right;
    margin-top: -4px;
  }
  .permit-card.warn .permit-days { color: var(--warn); }
  .permit-card.danger .permit-days { color: var(--red); }

  /* ── リスト ── */
  .log-item {
    padding: 12px 0;
    border-bottom: 1px solid var(--surface2);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .log-item:last-child { border-bottom: none; }
  .log-item .log-info { flex: 1; }
  .log-item .log-date { font-size: 11px; color: var(--text2); margin-bottom: 2px; }
  .log-item .log-desc { font-size: 14px; font-weight: 600; }
  .log-item .log-sub { font-size: 12px; color: var(--text2); margin-top: 2px; }
  .log-item .log-count {
    font-family: var(--font-mono);
    font-size: 20px;
    font-weight: 700;
    text-align: right;
    min-width: 60px;
  }
  .log-item .log-count.plus { color: var(--green); }
  .log-item .log-count.minus { color: var(--red); }

  /* ── 弾種タグ ── */
  .ammo-tag {
    display: inline-block;
    background: var(--olive);
    color: var(--brass-light);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    padding: 2px 8px;
    border-radius: 20px;
    text-transform: uppercase;
  }

  /* ── ボタン ── */
  .btn {
    border: none;
    border-radius: 10px;
    padding: 12px 20px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
    transition: opacity 0.15s;
  }
  .btn:active { opacity: 0.75; }
  .btn-primary { background: var(--olive); color: #fff; }
  .btn-brass { background: var(--brass); color: var(--olive); }
  .btn-outline {
    background: none;
    border: 1.5px solid var(--border);
    color: var(--text);
  }
  .btn-sm {
    padding: 7px 14px;
    font-size: 13px;
    width: auto;
    border-radius: 8px;
  }
  .btn-danger { background: var(--red); color: #fff; }

  /* ── フォーム ── */
  .form-group { margin-bottom: 14px; }
  label { font-size: 12px; font-weight: 600; color: var(--text2); letter-spacing: 0.06em; text-transform: uppercase; display: block; margin-bottom: 6px; }
  input, select, textarea {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-size: 15px;
    background: var(--surface);
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
    -webkit-appearance: none;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--olive); }
  textarea { resize: vertical; min-height: 80px; }

  /* ── モーダル ── */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 200;
    align-items: flex-end;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--bg);
    border-radius: 20px 20px 0 0;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    padding: 20px;
    padding-bottom: 40px;
  }
  .modal-title {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .modal-close {
    background: var(--surface2);
    border: none;
    border-radius: 50%;
    width: 32px;
    height: 32px;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ── ラジオ風セグメント ── */
  .segment {
    display: flex;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .segment label {
    flex: 1;
    text-align: center;
    padding: 10px;
    font-size: 14px;
    font-weight: 600;
    color: var(--text2);
    cursor: pointer;
    margin: 0;
    text-transform: none;
    letter-spacing: 0;
    transition: all 0.15s;
    background: var(--surface);
    border-right: 1px solid var(--border);
  }
  .segment label:last-child { border-right: none; }
  .segment input[type="radio"] { display: none; }
  .segment input[type="radio"]:checked + label {
    background: var(--olive);
    color: var(--brass-light);
  }

  /* ── 弾種リスト ── */
  .ammo-row {
    display: flex;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid var(--surface2);
    gap: 12px;
  }
  .ammo-row:last-child { border-bottom: none; }
  .ammo-row .ammo-info { flex: 1; }
  .ammo-row .ammo-name { font-weight: 700; font-size: 15px; }
  .ammo-row .ammo-meta { font-size: 12px; color: var(--text2); margin-top: 2px; }
  .ammo-row .ammo-stock {
    font-family: var(--font-mono);
    font-size: 22px;
    font-weight: 700;
    color: var(--olive);
    min-width: 50px;
    text-align: right;
  }
  .ammo-row .ammo-stock.low { color: var(--red); }

  .section-title {
    font-size: 11px;
    font-weight: 700;
    color: var(--text2);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin: 20px 0 10px;
  }

  .fab {
    position: fixed;
    bottom: 88px;
    right: 20px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--brass);
    color: var(--olive);
    font-size: 28px;
    border: none;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(0,0,0,0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 90;
    transition: transform 0.15s;
  }
  .fab:active { transform: scale(0.93); }

  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--text2);
  }
  .empty-state .empty-icon { font-size: 48px; margin-bottom: 12px; }
  .empty-state p { font-size: 14px; }

  .badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 20px;
    letter-spacing: 0.06em;
  }
  .badge-green { background: #D5F5E3; color: var(--green); }
  .badge-warn { background: #FDEBD0; color: var(--warn); }
  .badge-red { background: #FADBD8; color: var(--red); }

  .row-actions { display: flex; gap: 8px; margin-top: 10px; }

  .chip-select {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .chip {
    padding: 6px 14px;
    border-radius: 20px;
    border: 1.5px solid var(--border);
    font-size: 13px;
    cursor: pointer;
    background: var(--surface);
    color: var(--text);
    transition: all 0.15s;
  }
  .chip.selected {
    background: var(--olive);
    color: var(--brass-light);
    border-color: var(--olive);
  }

  /* ── 印刷ボタン ── */
  .print-btn {
    position: fixed;
    bottom: 88px;
    left: 20px;
    background: var(--olive);
    color: #fff;
    border: none;
    border-radius: 28px;
    padding: 12px 18px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(0,0,0,0.25);
    z-index: 90;
    display: flex;
    align-items: center;
    gap: 6px;
    letter-spacing: 0.04em;
    transition: opacity 0.15s;
  }
  .print-btn:active { opacity: 0.75; }

  /* ── 印刷スタイル ── */
  @media print {
    body { background: #fff; padding: 0; font-family: 'Yu Mincho', 'Hiragino Mincho ProN', serif; }
    header, nav, .fab, .print-btn, .modal-overlay, .page:not(#page-home) { display: none !important; }
    #page-home { display: block !important; padding: 0; }
    .summary-grid, #ammo-status-list .bullet-gauge { display: none; }

    .print-doc { display: block !important; }
    .no-print { display: none !important; }

    @page {
      size: A4;
      margin: 20mm 15mm 20mm 20mm;
    }
  }

  .print-doc { display: none; }
</style>
</head>
<body>

<header>
  <h1>🎯 実包管理帳</h1>
  <div class="subtitle">SHOTGUN AMMO MANAGEMENT</div>
</header>

<!-- ナビ -->
<nav>
  <button class="active" onclick="showPage('home')" id="nav-home">
    <span class="icon">🏠</span>ホーム
  </button>
  <button onclick="showPage('ammo')" id="nav-ammo">
    <span class="icon">🔴</span>弾種
  </button>
  <button onclick="showPage('log')" id="nav-log">
    <span class="icon">📋</span>記録
  </button>
  <button onclick="showPage('permit')" id="nav-permit">
    <span class="icon">📄</span>許可証
  </button>
</nav>

<!-- ホーム -->
<div class="page active" id="page-home">
  <div class="summary-grid" id="summary-grid">
    <!-- JS で生成 -->
  </div>

  <div class="card">
    <div class="card-header">残弾状況 <span id="total-badge"></span></div>
    <div class="card-body" id="ammo-status-list">
    </div>
  </div>

  <div class="card">
    <div class="card-header">許可証アラート</div>
    <div class="card-body" id="permit-alert-list">
    </div>
  </div>

  <div class="card">
    <div class="card-header">最近の記録</div>
    <div class="card-body" id="recent-logs">
    </div>
  </div>
</div>

<!-- 弾種管理 -->
<div class="page" id="page-ammo">
  <div class="card">
    <div class="card-header">登録弾種</div>
    <div class="card-body" id="ammo-list-body">
    </div>
  </div>
  <button class="btn btn-primary" onclick="openAmmoModal()">＋ 弾種を追加</button>
</div>

<!-- 記録 -->
<div class="page" id="page-log">
  <div class="card">
    <div class="card-header">
      記録一覧
      <button class="btn btn-brass btn-sm" onclick="openLogModal()">＋ 記録</button>
    </div>
    <div class="card-body" id="log-list-body">
    </div>
  </div>
</div>

<!-- 許可証 -->
<div class="page" id="page-permit">
  <div id="permit-list"></div>
  <button class="btn btn-primary" style="margin-top:4px" onclick="openPermitModal()">＋ 許可証を追加</button>
</div>

<!-- FAB -->
<button class="fab" onclick="openLogModal()" id="fab-btn">＋</button>

<!-- 印刷ボタン -->
<button class="print-btn no-print" onclick="printReport()">🖨️ PDF出力</button>

<!-- 印刷用ドキュメント（画面では非表示、印刷時のみ表示） -->
<div class="print-doc" id="print-doc"></div>

<!-- ===== モーダル: 実包記録 ===== -->
<div class="modal-overlay" id="log-modal">
  <div class="modal">
    <div class="modal-title">
      <span id="log-modal-title">📋 記録を追加</span>
      <button class="modal-close" onclick="closeModal('log-modal')">✕</button>
    </div>

    <div class="form-group">
      <label>種別</label>
      <div class="segment">
        <input type="radio" name="log-type" id="lt-buy" value="purchase" checked>
        <label for="lt-buy">🛒 購入・入手</label>
        <input type="radio" name="log-type" id="lt-use" value="use">
        <label for="lt-use">🔫 使用</label>
      </div>
    </div>

    <div class="form-group">
      <label>日付</label>
      <input type="date" id="log-date">
    </div>

    <div class="form-group">
      <label>弾種</label>
      <select id="log-ammo-type">
      </select>
    </div>

    <div class="form-group">
      <label>数量（発）</label>
      <input type="number" id="log-qty" min="1" placeholder="例: 25">
    </div>

    <div class="form-group" id="use-detail-group">
      <label>使用目的</label>
      <div class="chip-select" id="use-purpose-chips">
        <span class="chip selected" onclick="toggleChip(this)">🦆 狩猟</span>
        <span class="chip" onclick="toggleChip(this)">🎯 射撃練習</span>
        <span class="chip" onclick="toggleChip(this)">🏆 競技</span>
        <span class="chip" onclick="toggleChip(this)">その他</span>
      </div>
    </div>

    <div class="form-group" id="buy-detail-group" style="display:none">
      <label>入手先</label>
      <input type="text" id="log-source" placeholder="例: ○○銃砲店">
    </div>

    <div class="form-group">
      <label>メモ</label>
      <textarea id="log-memo" placeholder="場所、状況など自由にメモ"></textarea>
    </div>

    <button class="btn btn-primary" onclick="saveLog()">保存する</button>
  </div>
</div>

<!-- ===== モーダル: 弾種 ===== -->
<div class="modal-overlay" id="ammo-modal">
  <div class="modal">
    <div class="modal-title">
      🔴 弾種を登録
      <button class="modal-close" onclick="closeModal('ammo-modal')">✕</button>
    </div>

    <div class="form-group">
      <label>弾種名</label>
      <input type="text" id="ammo-name" placeholder="例: 12番スラッグ">
    </div>

    <div class="form-group">
      <label>口径 / 規格</label>
      <input type="text" id="ammo-caliber" placeholder="例: 12番、.308 Win">
    </div>

    <div class="form-group">
      <label>種類</label>
      <select id="ammo-category">
        <option value="slug">スラッグ弾</option>
        <option value="shot">散弾（ショット）</option>
        <option value="rifle">ライフル弾</option>
        <option value="handgun">拳銃弾</option>
        <option value="other">その他</option>
      </select>
    </div>

    <div class="form-group">
      <label>最低在庫アラート（発）</label>
      <input type="number" id="ammo-alert" min="0" placeholder="例: 10（空欄=アラートなし）">
    </div>

    <button class="btn btn-primary" onclick="saveAmmo()">登録する</button>
  </div>
</div>

<!-- ===== モーダル: 許可証 ===== -->
<div class="modal-overlay" id="permit-modal">
  <div class="modal">
    <div class="modal-title">
      📄 許可証を登録
      <button class="modal-close" onclick="closeModal('permit-modal')">✕</button>
    </div>

    <div class="form-group">
      <label>許可証名</label>
      <input type="text" id="permit-name" placeholder="例: 火薬類譲受許可証">
    </div>

    <div class="form-group">
      <label>許可番号</label>
      <input type="text" id="permit-no" placeholder="例: 第○○号">
    </div>

    <div class="form-group">
      <label>対象弾種（任意）</label>
      <input type="text" id="permit-ammo" placeholder="例: 12番散弾">
    </div>

    <div class="form-group">
      <label>許可数量（発）</label>
      <input type="number" id="permit-qty" min="1" placeholder="例: 100">
    </div>

    <div class="form-group">
      <label>有効期限</label>
      <input type="date" id="permit-expiry">
    </div>

    <div class="form-group">
      <label>メモ</label>
      <textarea id="permit-memo" placeholder="発行機関など"></textarea>
    </div>

    <button class="btn btn-primary" onclick="savePermit()">登録する</button>
  </div>
</div>

<script>
// ===== データ =====
let data = {
  ammoTypes: [],   // {id, name, caliber, category, alertQty}
  logs: [],        // {id, type, date, ammoTypeId, qty, purpose, source, memo}
  permits: []      // {id, name, number, ammoType, qty, expiry, memo}
};

const CATEGORY_LABEL = {
  slug: 'スラッグ',
  shot: '散弾',
  rifle: 'ライフル',
  handgun: '拳銃弾',
  other: 'その他'
};

function save() {
  localStorage.setItem('jitsuho_data', JSON.stringify(data));
}

function load() {
  const d = localStorage.getItem('jitsuho_data');
  if (d) {
    try { data = JSON.parse(d); } catch(e) {}
  }
}

// ===== ナビ =====
function showPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  document.getElementById('nav-' + name).classList.add('active');
  const fab = document.getElementById('fab-btn');
  fab.style.display = name === 'log' || name === 'home' ? 'flex' : 'none';
  render();
}

// ===== ストック計算 =====
function calcStock(ammoTypeId) {
  return data.logs.reduce((sum, l) => {
    if (l.ammoTypeId !== ammoTypeId) return sum;
    return l.type === 'purchase' ? sum + Number(l.qty) : sum - Number(l.qty);
  }, 0);
}

function totalStock() {
  return data.ammoTypes.reduce((sum, a) => sum + Math.max(0, calcStock(a.id)), 0);
}

// ===== 残日数 =====
function daysLeft(expiry) {
  if (!expiry) return 9999;
  const diff = new Date(expiry) - new Date();
  return Math.ceil(diff / (1000 * 60 * 60 * 24));
}

// ===== 弾ゲージ =====
function bulletGauge(count, max) {
  const show = Math.min(count, max);
  let html = '<div class="bullet-gauge">';
  for (let i = 0; i < max; i++) {
    html += `<span class="bullet-icon${i >= show ? ' empty' : ''}">🔴</span>`;
  }
  html += '</div>';
  return html;
}

// ===== 保存 =====
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

function saveLog() {
  const type = document.querySelector('input[name="log-type"]:checked').value;
  const date = document.getElementById('log-date').value;
  const ammoTypeId = document.getElementById('log-ammo-type').value;
  const qty = document.getElementById('log-qty').value;
  const memo = document.getElementById('log-memo').value;

  if (!date || !ammoTypeId || !qty || Number(qty) <= 0) {
    alert('日付・弾種・数量を入力してください');
    return;
  }

  const purpose = document.querySelector('#use-purpose-chips .chip.selected')?.textContent || '';
  const source = document.getElementById('log-source').value;

  data.logs.push({ id: uid(), type, date, ammoTypeId, qty: Number(qty), purpose, source, memo });
  save();
  closeModal('log-modal');
  render();
}

function saveAmmo() {
  const name = document.getElementById('ammo-name').value.trim();
  const caliber = document.getElementById('ammo-caliber').value.trim();
  const category = document.getElementById('ammo-category').value;
  const alertQty = document.getElementById('ammo-alert').value;

  if (!name || !caliber) {
    alert('弾種名と口径を入力してください');
    return;
  }

  data.ammoTypes.push({ id: uid(), name, caliber, category, alertQty: alertQty ? Number(alertQty) : null });
  save();
  closeModal('ammo-modal');
  render();
}

function savePermit() {
  const name = document.getElementById('permit-name').value.trim();
  const number = document.getElementById('permit-no').value.trim();
  const ammoType = document.getElementById('permit-ammo').value.trim();
  const qty = document.getElementById('permit-qty').value;
  const expiry = document.getElementById('permit-expiry').value;
  const memo = document.getElementById('permit-memo').value;

  if (!name || !expiry) {
    alert('許可証名と有効期限は必須です');
    return;
  }

  data.permits.push({ id: uid(), name, number, ammoType, qty: qty ? Number(qty) : null, expiry, memo });
  save();
  closeModal('permit-modal');
  render();
}

// ===== 削除 =====
function deleteLog(id) {
  if (!confirm('この記録を削除しますか？')) return;
  data.logs = data.logs.filter(l => l.id !== id);
  save(); render();
}

function deleteAmmo(id) {
  if (!confirm('この弾種と関連する記録もすべて削除されます。よろしいですか？')) return;
  data.ammoTypes = data.ammoTypes.filter(a => a.id !== id);
  data.logs = data.logs.filter(l => l.ammoTypeId !== id);
  save(); render();
}

function deletePermit(id) {
  if (!confirm('この許可証を削除しますか？')) return;
  data.permits = data.permits.filter(p => p.id !== id);
  save(); render();
}

// モーダル外クリックで閉じる
document.querySelectorAll('.modal-overlay').forEach(o => {
  o.addEventListener('click', e => {
    if (e.target === o) o.classList.remove('open');
  });
});
